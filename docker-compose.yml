# StudAI rodando como aplicação local, com backup automático.
#   docker compose up -d --build   → http://127.0.0.1:8787 (Docker Engine ou Docker Desktop)
# Os dados continuam nas pastas do repositório (montadas abaixo); os backups vão para ./backups.

x-studai: &studai
  build: .
  image: studai:local
  user: "${STUDAI_UID:-1000}:${STUDAI_GID:-1000}"
  env_file:
    - path: .env
      required: false
  environment:
    TZ: ${TZ:-America/Campo_Grande}
  restart: unless-stopped
  volumes:
    - ./simulados:/app/simulados
    - ./diagnostico:/app/diagnostico
    - ./docs:/app/docs:ro
    - ./fuvest_acervo:/app/fuvest_acervo:ro

services:
  app:
    <<: *studai
    # Porta publicada só no próprio PC. Funciona no Docker Engine e no Docker Desktop (que roda
    # os containers numa VM: com "network_mode: host" a porta abria na VM, não no PC).
    command: ["python", "api.py", "--host", "0.0.0.0", "--port", "8787"]
    ports:
      - "127.0.0.1:8787:8787"
    # O Ollama do PC fica em host.docker.internal; o .env costuma apontar para 127.0.0.1, que
    # dentro do container é o próprio container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-America/Campo_Grande}
      OLLAMA_BASE_URL: ${STUDAI_DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backup:
    <<: *studai
    network_mode: none
    command:
      - python
      - -m
      - studai.tools.backup
      - --interval-hours
      - "${STUDAI_BACKUP_INTERVAL_HOURS:-24}"
      - --keep
      - "${STUDAI_BACKUP_KEEP:-7}"
    volumes:
      - ./simulados:/app/simulados
      - ./diagnostico:/app/diagnostico
      - ./backups:/app/backups
