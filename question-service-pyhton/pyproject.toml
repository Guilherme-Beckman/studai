[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studai"
version = "0.1.0"
description = "Processamento de simulados e diagnóstico de estudos"
requires-python = ">=3.10"
dependencies = ["pymupdf"]

[project.optional-dependencies]
benchmark = ["datasets>=3.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
